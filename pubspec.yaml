# ==============================================================================
# PROJECT METADATA
# ==============================================================================

name: sheety_localization

description: >
  Generate Flutter (Dart), TypeScript and Python localization code from
  Google Sheets, with ICU plural/select support, validation, and AI-assisted
  translation of missing cells.

version: 1.0.0

homepage: https://github.com/DoctorinaAI/sheety_localization
repository: https://github.com/DoctorinaAI/sheety_localization
issue_tracker: https://github.com/DoctorinaAI/sheety_localization/issues

topics:
  - localization
  - cli
  - google-sheets
  - l10n
  - i18n

platforms:
  linux:
  macos:
  windows:

# ==============================================================================
# PROJECT STRUCTURE
# ==============================================================================

# dart pub global activate --source path .
# dart run sheety_localization:generate
executables:
  generate: generate
  localize: localize

# ==============================================================================
# DEPENDENCIES
# ==============================================================================

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  path: ^1.9.1
  args: ^2.7.0
  googleapis: ">=14.0.0 <16.0.0"
  googleapis_auth: ^2.0.0
  yaml: ^3.1.2

dev_dependencies:
  http: ^1.2.0
  intl: ^0.20.2
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0

