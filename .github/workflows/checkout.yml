name: Checkout

on:
  workflow_dispatch:
    inputs:
      dart-version:
        description: "Dart SDK version to use"
        default: "stable"
        required: false
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "bin/**.dart"
      - "lib/**.dart"
      - "test/**.dart"
      - "test/fixtures/**"
      - "dart_test.yaml"
      - "example/**.dart"
      - "example/**.html"
      - ".github/workflows/*.yml"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "dev"
      - "develop"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "bin/**.dart"
      - "lib/**.dart"
      - "test/**.dart"
      - "test/fixtures/**"
      - "dart_test.yaml"
      - "example/**.dart"
      - "example/**.html"
      - ".github/workflows/*.yml"
      - "pubspec.yaml"
      - "analysis_options.yaml"

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    name: "Checkout"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    container:
      image: dart:${{ github.event.inputs.dart-version || 'stable' }}
    env:
      pub-cache: pub
      PUB_CACHE: /github/home/.pub-cache
    timeout-minutes: 25
    outputs:
      version: ${{ steps.setup.outputs.version }}
    concurrency:
      group: checkout-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/

      - name: 🚂 Setup dependencies
        id: setup
        timeout-minutes: 5
        uses: ./.github/actions/setup
        with:
          pub-cache: packages

      - name: 🚦 Check code format
        id: check-format
        timeout-minutes: 1
        run: dart format --set-exit-if-changed --line-length 80 -o none bin/ lib/ test/

      - name: 🔍 Check what would be published
        id: check-published-files
        timeout-minutes: 2
        # A .pubignore replaces the .gitignore of its own directory for
        # `pub publish`, so a rule forgotten there uploads credentials or
        # build output to pub.dev. This is the last line of defence.
        run: |
          dart pub publish --dry-run > /tmp/publish-set.txt 2>&1 || true
          sed -E 's/.*[├└]── //; s/ \([^)]*\)$//' /tmp/publish-set.txt |
            grep -iE '^([^ ]+\.(key|pem|p12|jks|keystore)|[^ ]+\.vm\.json|credentials\.json|service-account[^ ]*\.json|build|coverage|reports|node_modules)$' \
            > /tmp/leaked.txt || true
          if [ -s /tmp/leaked.txt ]; then
            echo "::error::Files that must never reach pub.dev are in the published set:"
            cat /tmp/leaked.txt
            echo "Add them to .pubignore - it replaces .gitignore for pub."
            exit 1
          fi
          echo "The published file set is clean."

      - name: 📈 Check analyzer
        id: check-analyzer
        timeout-minutes: 1
        run: dart analyze --fatal-infos --fatal-warnings bin/ lib/ test/

      - name: 🧰 Install Node.js, Python and mypy
        id: install-integration-tools
        timeout-minutes: 5
        # The integration tests compile and run the generated TypeScript
        # (node + npx tsc) and Python (python3 + mypy --strict). Without these
        # tools they skip, so install them to actually exercise the output.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            nodejs npm python3 mypy ca-certificates > /dev/null
          node --version && npm --version
          python3 --version && mypy --version

      - name: 🧪 Run unit and integration tests
        id: run-unit-tests
        timeout-minutes: 10
        run: |
          dart test --color --platform=vm --concurrency=12 \
            --timeout=120s --reporter=github

  flutter-integration:
    name: "Flutter integration"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: flutter-integration-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🐍 Setup Python and mypy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 👷 Install dependencies
        run: |
          python -m pip install --quiet mypy
          dart pub get --no-example

      - name: 🧪 Run integration tests (generated Dart analyzed by Flutter)
        timeout-minutes: 15
        # The generated Dart imports package:flutter, so analyzing and
        # running it needs the Flutter SDK; the container job above only has
        # the Dart SDK and skips those tests.
        run: |
          dart test --color --platform=vm --tags=integration \
            --timeout=300s --reporter=github
